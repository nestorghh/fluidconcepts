[project]
name = "pd-books"
version = "0.1.0"
description = "Metadata ingestion pipeline for public domain books"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34"]
dev = ["pytest>=8.0"]

[project.scripts]
pd-books = "pd_books.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pd_books"]

[tool.pytest.ini_options]
testpaths = ["tests"]
